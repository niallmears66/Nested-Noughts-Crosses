<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nested Noughts and Crosses</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <main>
    <aside class="scoreboard scoreboard-x" aria-label="Player X score">
      <svg class="score-icon" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M8 8L32 32M32 8L8 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
      <div class="score-label">Player X</div>
      <div class="score-value" id="score-x" aria-live="polite">0</div>
    </aside>

    <canvas id="game-canvas"></canvas>

    <aside class="scoreboard scoreboard-o" aria-label="Player O score">
      <svg class="score-icon" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="4" />
      </svg>
      <div class="score-label">Player O</div>
      <div class="score-value" id="score-o" aria-live="polite">0</div>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
