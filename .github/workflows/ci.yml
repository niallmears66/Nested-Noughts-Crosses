name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Fail the build on syntax errors / undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full style report, non-blocking.
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests (headless)
        run: pytest -v

  package:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Create build artifact
        run: |
          mkdir -p dist
          zip -r dist/nested-tictactoe.zip game.py mainMenu.py rules.py terminal.py requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nested-tictactoe-build
          path: dist/nested-tictactoe.zip
          retention-days: 14
